server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Interim demo-safe CSP (no BFF). Allowlist matches actual frontend usage:
    # Google Fonts, Tabler Icons (jsDelivr), YouTube embeds, Cloud Run APIs/media.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://*.run.app; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' https://*.run.app blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
